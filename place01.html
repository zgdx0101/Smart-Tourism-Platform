<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: white;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        video {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            display: block;
            background: black;
        }

        @media (max-width: 700px) {
            .video-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="video-container">

    <video controls playsinline preload="metadata">
        <source src="videos/video1.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video2.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video3.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video4.mp4" type="video/mp4">
    </video>

</div>

</body>
</html>
