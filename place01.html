<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
        }

        .video-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="video-container">

    <video controls playsinline preload="metadata">
        <source src="place01/video1.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video2.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video3.mp4" type="video/mp4">
    </video>

    <video controls playsinline preload="metadata">
        <source src="place01/video4.mp4" type="video/mp4">
    </video>

</div>

</body>
</html>
