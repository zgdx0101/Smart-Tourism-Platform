<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: white;
}

body {
    overflow-x: hidden;
}

/* =========================
   คอมพิวเตอร์
   4 วิดีโอเรียงแนวนอน
   ========================= */

.video-container {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    padding: 10px;
}

.video-box {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 10px;
    background: black;
}

video {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    background: black;
}

/* ปุ่มเต็มจอ */
.fullscreen-btn {
    position: absolute;
    right: 8px;
    bottom: 45px;

    width: 40px;
    height: 40px;

    border: none;
    border-radius: 8px;

    background: rgba(0,0,0,0.75);
    color: white;

    font-size: 22px;
    cursor: pointer;
    z-index: 10;
}


/* =========================
   มือถือ
   4 วิดีโอเรียงแนวนอน
   ปัดซ้าย-ขวา
   ========================= */

@media (max-width: 700px) {

    .video-container {
        display: flex;

        width: 100%;

        overflow-x: auto;
        overflow-y: hidden;

        gap: 12px;

        padding: 10px;

        scroll-snap-type: x mandatory;

        -webkit-overflow-scrolling: touch;

        scrollbar-width: none;
    }

    /* ซ่อน Scrollbar */
    .video-container::-webkit-scrollbar {
        display: none;
    }

    .video-box {
        width: 75vw;
        min-width: 75vw;
        max-width: 75vw;

        scroll-snap-align: start;
    }

    video {
        width: 100%;
        aspect-ratio: 9 / 16;
    }

    .fullscreen-btn {
        width: 42px;
        height: 42px;

        right: 8px;
        bottom: 48px;

        font-size: 22px;
    }
}

</style>
</head>


<body>

<div class="video-container">

    <!-- VIDEO 1 -->
    <div class="video-box">

        <video controls playsinline preload="metadata">
            <source src="videos/video1.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)">
            ⛶
        </button>

    </div>


    <!-- VIDEO 2 -->
    <div class="video-box">

        <video controls playsinline preload="metadata">
            <source src="videos/video2.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)">
            ⛶
        </button>

    </div>


    <!-- VIDEO 3 -->
    <div class="video-box">

        <video controls playsinline preload="metadata">
            <source src="videos/video3.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)">
            ⛶
        </button>

    </div>


    <!-- VIDEO 4 -->
    <div class="video-box">

        <video controls playsinline preload="metadata">
            <source src="videos/video4.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)">
            ⛶
        </button>

    </div>

</div>


<script>

function openFullscreen(button) {

    const video =
        button.closest(".video-box")
        .querySelector("video");

    /* iPhone / Safari */
    if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
        return;
    }

    /* Chrome / Android / Desktop */
    if (video.requestFullscreen) {
        video.requestFullscreen();
        return;
    }

    /* Safari */
    if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
        return;
    }

}

</script>

</body>
</html>
