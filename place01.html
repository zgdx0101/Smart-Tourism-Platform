<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>วิดีโอแนะนำสถานที่</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: white;
        }

        body {
            overflow-x: hidden;
        }

        /* กล่องรวมวิดีโอ */
        .video-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            padding: 10px;
        }

        /* กล่องของแต่ละวิดีโอ */
        .video-box {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        /* วิดีโอแนวตั้ง */
        video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #000;
        }

        /* ปุ่มเต็มจอ */
        .fullscreen-btn {
            position: absolute;
            right: 8px;
            bottom: 45px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 22px;
            line-height: 40px;
            text-align: center;

            cursor: pointer;
            z-index: 10;
        }

        .fullscreen-btn:active {
            transform: scale(0.92);
        }

        /* =========================
           มือถือ
           ========================= */
        @media (max-width: 700px) {

            .video-container {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 10px;
            }

            .video-box {
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
            }

            video {
                width: 100%;
                aspect-ratio: 9 / 16;
            }

            .fullscreen-btn {
                width: 42px;
                height: 42px;
                line-height: 42px;
                right: 10px;
                bottom: 48px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="video-container">

    <!-- วิดีโอ 1 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video1.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
            aria-label="เต็มหน้าจอ">
            ⛶
        </button>
    </div>


    <!-- วิดีโอ 2 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video2.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
            aria-label="เต็มหน้าจอ">
            ⛶
        </button>
    </div>


    <!-- วิดีโอ 3 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video3.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
            aria-label="เต็มหน้าจอ">
            ⛶
        </button>
    </div>


    <!-- วิดีโอ 4 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video4.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
            aria-label="เต็มหน้าจอ">
            ⛶
        </button>
    </div>

</div>


<script>
function openFullscreen(button) {

    const video = button
        .closest(".video-box")
        .querySelector("video");

    /* iPhone / Safari */
    if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
        return;
    }

    /* Chrome / Android / Desktop */
    if (video.requestFullscreen) {
        video.requestFullscreen();
        return;
    }

    /* Safari รุ่นอื่น */
    if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
        return;
    }

    alert("อุปกรณ์นี้ไม่รองรับโหมดเต็มหน้าจอ");
}
</script>

</body>
</html>
