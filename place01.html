<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>วิดีโอแนะนำสถานที่</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #fff;
}

/* =========================
   กล่องรวมวิดีโอ
   ========================= */

.video-container {
    width: 100%;

    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;

    gap: 12px;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    align-items: flex-start;
}

.video-container::-webkit-scrollbar {
    display: none;
}


/* =========================
   PC
   4 คลิปต่อแถว
   ========================= */

.video-box {
    position: relative;

    flex: 0 0 calc(25% - 9px);

    width: calc(25% - 9px);

    min-width: 0;
}


/* =========================
   ตัววิดีโอ PC
   ========================= */

.video-box video {

    display: block;

    width: 100%;

    /*
       9:16
       ความสูงจะถูกบังคับตามสัดส่วน
    */
    height: auto;

    aspect-ratio: 9 / 16;

    object-fit: cover;

    background: #000;

    border-radius: 16px;
}


/* =========================
   ปุ่ม Fullscreen
   ========================= */

.fullscreen-btn {

    position: absolute;

    right: 10px;
    bottom: 10px;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: rgba(0,0,0,0.65);

    color: white;

    font-size: 20px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;
}

.fullscreen-btn:hover {
    background: rgba(0,0,0,0.85);
}


/* =========================
   MOBILE
   ปัดซ้าย / ขวา
   ========================= */

@media (max-width: 700px) {

    .video-container {

        width: 100%;

        display: flex;

        flex-direction: row;

        flex-wrap: nowrap;

        gap: 10px;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        scroll-snap-type: x mandatory;
    }


    .video-box {

        flex: 0 0 75vw;

        width: 75vw;

        min-width: 75vw;
        max-width: 75vw;

        scroll-snap-align: start;
    }


    .video-box video {

        width: 100%;

        /*
           บังคับ 9:16
        */
        height: calc(75vw * 16 / 9);

        aspect-ratio: 9 / 16;

        object-fit: cover;

        border-radius: 16px;
    }

}

</style>
</head>


<body>

<div class="video-container">


    <!-- VIDEO 1 -->

    <div class="video-box">

        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video1.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >
            ⛶
        </button>

    </div>


    <!-- VIDEO 2 -->

    <div class="video-box">

        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video2.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >
            ⛶
        </button>

    </div>


    <!-- VIDEO 3 -->

    <div class="video-box">

        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video3.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >
            ⛶
        </button>

    </div>


    <!-- VIDEO 4 -->

    <div class="video-box">

        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video4.mp4" type="video/mp4">
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >
            ⛶
        </button>

    </div>


</div>


<script>

function openFullscreen(button) {

    const video = button.parentElement.querySelector("video");

    if (!video) return;

    if (video.requestFullscreen) {

        video.requestFullscreen();

    } else if (video.webkitEnterFullscreen) {

        video.webkitEnterFullscreen();

    } else if (video.webkitRequestFullscreen) {

        video.webkitRequestFullscreen();

    }

}

</script>

</body>
</html>
