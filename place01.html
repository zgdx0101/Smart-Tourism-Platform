<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: white;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        .video-box {
            position: relative;
            width: 100%;
        }

        video {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            display: block;
            background: black;
        }

        /* ปุ่มเต็มจอ */
        .fullscreen-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 22px;
            cursor: pointer;

            z-index: 5;
        }

        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.95);
        }

        /* มือถือ */
        @media (max-width: 700px) {
            .video-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .fullscreen-btn {
                width: 36px;
                height: 36px;
                right: 6px;
                bottom: 6px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="video-container">

    <!-- VIDEO 1 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video1.mp4" type="video/mp4">
        </video>

        <button class="fullscreen-btn" onclick="fullscreenVideo(this)">
            ⛶
        </button>
    </div>


    <!-- VIDEO 2 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video2.mp4" type="video/mp4">
        </video>

        <button class="fullscreen-btn" onclick="fullscreenVideo(this)">
            ⛶
        </button>
    </div>


    <!-- VIDEO 3 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video3.mp4" type="video/mp4">
        </video>

        <button class="fullscreen-btn" onclick="fullscreenVideo(this)">
            ⛶
        </button>
    </div>


    <!-- VIDEO 4 -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="videos/video4.mp4" type="video/mp4">
        </video>

        <button class="fullscreen-btn" onclick="fullscreenVideo(this)">
            ⛶
        </button>
    </div>

</div>


<script>
function fullscreenVideo(button) {

    const video = button.parentElement.querySelector("video");

    if (video.requestFullscreen) {
        video.requestFullscreen();

    } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();

    } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();

    } else {
        alert("เบราว์เซอร์นี้ไม่รองรับโหมดเต็มจอ");
    }
}
</script>

</body>
</html>
