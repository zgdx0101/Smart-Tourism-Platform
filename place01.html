<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>วิดีโอแนะนำสถานที่</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: white;
    font-family: Arial, sans-serif;
}

/* =========================
   กล่องรวมวิดีโอ
========================= */
.video-container {
    width: 100%;
    display: flex;
    flex-wrap: nowrap;
    gap: 12px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;
}

.video-container::-webkit-scrollbar {
    display: none;
}

/* =========================
   PC
   4 คลิปเต็มพื้นที่
========================= */
.video-box {
    position: relative;

    flex: 1 1 0;
    min-width: 0;

    scroll-snap-align: start;
    overflow: hidden;
    border-radius: 10px;
    background: #eee;
}

/* วิดีโอแนวตั้ง 9:16 */
.video-box video {
    display: block;

    width: 100%;
    aspect-ratio: 9 / 16;

    object-fit: cover;

    background: #000;
}

/* =========================
   ปุ่ม Fullscreen
========================= */
.fullscreen-btn {
    position: absolute;

    right: 8px;
    bottom: 8px;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.65);
    color: white;

    font-size: 20px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;
}

.fullscreen-btn:hover {
    background: rgba(0, 0, 0, 0.85);
}

/* =========================
   มือถือ
   แถวเดียว ปัดซ้าย-ขวา
========================= */
@media (max-width: 700px) {

    .video-container {
        gap: 10px;
        padding: 0;
    }

    .video-box {
        flex: 0 0 75vw;
        width: 75vw;
        min-width: 75vw;
        max-width: 75vw;
    }

    .video-box video {
        width: 100%;
        aspect-ratio: 9 / 16;
        object-fit: cover;
    }

    .fullscreen-btn {
        width: 36px;
        height: 36px;
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="video-container">

    <!-- VIDEO 1 -->
    <div class="video-box">
        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video1.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >⛶</button>
    </div>


    <!-- VIDEO 2 -->
    <div class="video-box">
        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video2.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >⛶</button>
    </div>


    <!-- VIDEO 3 -->
    <div class="video-box">
        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video3.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >⛶</button>
    </div>


    <!-- VIDEO 4 -->
    <div class="video-box">
        <video
            controls
            playsinline
            preload="metadata"
        >
            <source src="videos/video4.mp4" type="video/mp4">
            เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>

        <button
            class="fullscreen-btn"
            onclick="openFullscreen(this)"
        >⛶</button>
    </div>

</div>


<script>
function openFullscreen(button) {

    const video = button.parentElement.querySelector("video");

    /* iPhone / Safari */
    if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
        return;
    }

    /* Chrome / Edge / Android */
    if (video.requestFullscreen) {
        video.requestFullscreen();
        return;
    }

    /* Safari รุ่นใหม่ */
    if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
        return;
    }
}
</script>

</body>
</html>
